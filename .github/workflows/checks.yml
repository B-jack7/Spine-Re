name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            reproduce
            scripts
            tests
            notebooks
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install numpy Pillow
      - run: python reproduce/test_core.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_notebooks.py
